<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found · Alice Millage</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237c3aed'/><text x='50' y='66' font-size='46' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'>AM</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    .not-found { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 48px 0; }
    .not-found .code { font-family: var(--font-display); font-size: clamp(5rem, 18vw, 9rem); line-height: 1; margin: 0; }
    .not-found p { color: var(--muted); max-width: 42ch; margin: 12px auto 28px; }
    .not-found .hero-cta { justify-content: center; }
  </style>
</head>
<body>
  <main class="not-found container">
    <div>
      <h1 class="code"><span class="gradient">404</span></h1>
      <h2>This page wandered off.</h2>
      <p>The page you're looking for doesn't exist or has moved. Let's get you back to the portfolio.</p>
      <div class="hero-cta">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/#projects">See my projects</a>
      </div>
    </div>
  </main>
</body>
</html>
